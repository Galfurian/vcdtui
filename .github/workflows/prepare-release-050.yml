name: Prepare release 0.5.0

on:
  push:
    branches: [release/0.5.0]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version and changelog
        shell: python
        run: |
          from pathlib import Path

          source = Path('vcdtui.py')
          text = source.read_text(encoding='utf-8')
          old = '__version__ = "0.4.0"'
          new = '__version__ = "0.5.0"'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one 0.4.0 version declaration')
          source.write_text(text.replace(old, new), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '# Changelog\n\n'
          if not text.startswith(marker):
              raise SystemExit('unexpected changelog header')
          entry = '''## 0.5.0

This release makes the waveform easier to use both interactively and outside the
TUI: the signal-selection pane can get out of the way when screen space matters,
and the same waveform renderer can now produce a deterministic fixed-width view
for terminals, CI logs, documentation and issue reports.

### Waveform output

- `--dump-wave` renders selected signals as a static waveform to stdout using the
  same interval-aware waveform and ruler logic as the interactive view.
- `--wave-width COLUMNS` sets the total output width, including signal names. It
  defaults to 80 columns, stays independent of terminal size, and rejects widths
  below 32 columns rather than emitting an unreadable layout.
- Static waveform output respects `--signals`, `--scope`, `--from`, `--to` and
  `--ascii`. Vector values use binary display by default, and `--dump` and
  `--dump-wave` are mutually exclusive output modes.

### Interactive view

- `s` / `S` hides or restores the signal-selection pane. Hiding it reclaims the
  left-hand width for the value and waveform area and moves focus to the waveform
  pane, so keyboard navigation never targets an invisible control.
- `Tab` stays on the visible waveform pane while the signal tree is hidden, and
  the help panel documents the new shortcut.

### Qualification

- Added focused coverage for the signal-tree layout/focus behavior and for static
  waveform rendering at the default 80-column width and custom widths.

'''
          changelog.write_text(marker + entry + text[len(marker):], encoding='utf-8')
      - name: Run test suite
        run: python3 -m unittest discover -s tests -v
      - name: Commit release metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vcdtui.py CHANGELOG.md
          git commit -m 'Release 0.5.0'
          git push
